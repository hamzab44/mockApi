name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install && npm install express cors @monaco-editor/react

      - name: Check server.cjs syntax
        run: node --check server.cjs

      - name: Build Vite
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install && npm install express cors @monaco-editor/react

      - name: Run ESLint
        run: npm run lint

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install && npm install express cors @monaco-editor/react

      - name: Audit dependencies
        run: npm audit --audit-level=high

  validate-mockoon:
    name: Validate Mockoon Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate server.cjs exports required routes
        run: |
          node -e "
          const fs = require('fs');
          const content = fs.readFileSync('server.cjs', 'utf8');
          const required = ['/api/files', '/api/read', '/api/write', '/api/mock/load'];
          required.forEach(route => {
            if (!content.includes(route)) {
              console.error('Missing required route: ' + route);
              process.exit(1);
            }
          });
          console.log('All required routes present');
          "

      - name: Validate version.js exists and has correct format
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('src/version.js')) {
            console.error('src/version.js is missing');
            process.exit(1);
          }
          const content = fs.readFileSync('src/version.js', 'utf8');
          if (!content.includes('VERSION') || !content.includes('CHANGELOG')) {
            console.error('version.js missing VERSION or CHANGELOG export');
            process.exit(1);
          }
          console.log('version.js is valid');
          "

      - name: Validate Makefile has required targets
        run: |
          node -e "
          const fs = require('fs');
          const content = fs.readFileSync('Makefile', 'utf8');
          const required = ['install', 'start', 'stop'];
          required.forEach(target => {
            if (!content.includes(target + ':')) {
              console.error('Missing Makefile target: ' + target);
              process.exit(1);
            }
          });
          console.log('Makefile is valid');
          "

  test-rules-engine:
    name: Test Rules Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Test rules engine
        run: |
          node -e "
          // Simule les fonctions du moteur de règles
          function getNestedValue(obj, path) {
            if (!path || path.trim() === '') return null;
            return path.split('.').reduce((current, key) => {
              if (current === null || current === undefined) return undefined;
              const index = parseInt(key);
              if (!isNaN(index) && Array.isArray(current)) return current[index];
              return current[key];
            }, obj);
          }

          function cleanValue(v) {
            if (typeof v !== 'string') return String(v);
            if (v.startsWith('\"') && v.endsWith('\"')) {
              try { return JSON.parse(v); } catch {}
            }
            return v;
          }

          // Tests
          const tests = [
            // getNestedValue
            { fn: () => getNestedValue({a: {b: 'ok'}}, 'a.b'), expected: 'ok', label: 'nested property' },
            { fn: () => getNestedValue({list: [{val: 42}]}, 'list.0.val'), expected: 42, label: 'array index' },
            { fn: () => getNestedValue({a: 1}, ''), expected: null, label: 'empty path' },
            { fn: () => getNestedValue(null, 'a'), expected: undefined, label: 'null object' },
            // cleanValue
            { fn: () => cleanValue('\"hello\"'), expected: 'hello', label: 'strip quotes' },
            { fn: () => cleanValue('hello'), expected: 'hello', label: 'no quotes' },
            { fn: () => cleanValue('\"7878785654001\"'), expected: '7878785654001', label: 'strip number quotes' },
            // regex
            { fn: () => new RegExp('^100\$').test('100'), expected: true, label: 'regex exact match 100' },
            { fn: () => new RegExp('^100\$').test('-100'), expected: false, label: 'regex no match -100' },
            { fn: () => new RegExp('^-100\$').test('-100'), expected: true, label: 'regex exact match -100' },
            { fn: () => new RegExp('^\$').test(''), expected: true, label: 'regex empty string' },
          ];

          let passed = 0;
          let failed = 0;
          tests.forEach(t => {
            const result = t.fn();
            if (JSON.stringify(result) === JSON.stringify(t.expected)) {
              console.log('✓ ' + t.label);
              passed++;
            } else {
              console.error('✗ ' + t.label + ' — expected: ' + JSON.stringify(t.expected) + ' got: ' + JSON.stringify(result));
              failed++;
            }
          });

          console.log('\n' + passed + '/' + (passed+failed) + ' tests passed');
          if (failed > 0) process.exit(1);
          "
